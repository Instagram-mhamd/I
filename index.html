<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معهد بدر السلام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;500;700;800&family=Amiri:wght@400;700&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ==========================================
           1) المتغيرات الأساسية
           ========================================== */
        :root {
            --primary-gold: #c47f32;
            --primary-gold-glow: rgba(196, 127, 50, 0.3);
            --bg-dark: #134e4a;
            --bg-card: #0d9488;
            --bg-body-from: #134e4a;
            --bg-body-to: #0f766e;
            --text-white: #ffffff;
            --text-muted: #d8eeea;
            --border-color: #c47f32;
            --input-bg: rgba(19, 78, 74, 0.72);
            --danger-color: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.4);
            --success-color: #15803d;

            /* متغيرات التخصيص المتقدمة */
            --card-radius: 12px;
            --btn-radius: 8px;
            --card-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
            --card-hover-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
            --border-top-width: 4px;
            --body-font: 'Cairo', sans-serif;
            --title-font: 'Tajawal', sans-serif;
            --body-bg-pattern-opacity: 0.03;
            --hover-lift: -5px;
            --transition-speed: 0.3s;
        }

        /* ==========================================
           2) الوضع الداكن
           ========================================== */
        body.dark-mode {
            --bg-body-from: #0a2a28;
            --bg-body-to: #06201f;
            --bg-card: #0a3d3a;
            --text-white: #f5f5f5;
            --text-muted: #b8ccc8;
        }

        /* ==========================================
           3) إخفاء أشرطة التمرير
           ========================================== */
        ::-webkit-scrollbar {
            display: none;
            width: 0;
            background: transparent;
        }
        html, body, .modal-content {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ==========================================
           4) إعادة تعيين عامة
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        /* ==========================================
           5) الجسم الرئيسي
           ========================================== */
        body {
            font-family: var(--body-font);
            background: radial-gradient(
                            circle at 15% 0%,
                            rgba(196, 127, 50, 0.2),
                            transparent 28rem
                        ),
                        linear-gradient(
                            135deg,
                            var(--bg-body-from),
                            var(--bg-body-to)
                        );
            color: var(--text-white);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            transition: background var(--transition-speed) ease,
                        color var(--transition-speed) ease;
        }

        /* ==========================================
           6) نمط الخلفية المزخرفة
           ========================================== */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(
                                var(--primary-gold) 1px,
                                transparent 1px
                             );
            background-size: 30px 30px;
            opacity: var(--body-bg-pattern-opacity);
            z-index: -1;
            pointer-events: none;
        }

        /* ==========================================
           7) الشريط العلوي
           ========================================== */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(19, 78, 74, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 2px solid var(--primary-gold);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 8px 24px rgba(31, 49, 55, 0.1);
        }

        .nav-menu-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid var(--primary-gold);
            background: rgba(196, 127, 50, 0.12);
            color: var(--text-white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .nav-menu-toggle:hover {
            background: var(--primary-gold);
            color: var(--bg-dark);
        }

        .nav-btn {
            background: rgba(196, 127, 50, 0.12);
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: var(--btn-radius);
            font-family: var(--title-font);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .nav-btn:hover,
        .nav-btn.active {
            background: var(--primary-gold);
            color: var(--bg-dark);
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px var(--primary-gold-glow);
        }

        /* ==========================================
           8) الرأس والشعار
           ========================================== */
        header {
            padding: 115px 20px 42px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            background: var(--primary-gold-glow);
            filter: blur(40px);
            border-radius: 50%;
            z-index: 0;
        }
        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--primary-gold);
            object-fit: cover;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            background: #fff;
        }
        h1 {
            font-family: var(--title-font);
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to bottom, #ffffff, var(--primary-gold));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        /* ==========================================
           9) الحاويات الرئيسية
           ========================================== */
        main {
            padding: 20px 15px 100px;
            max-width: 1100px;
            margin: 0 auto;
            min-height: 80vh;
        }
        .view-section {
            display: none;
            animation: slideUp 0.5s ease;
        }
        .view-section.active {
            display: block;
        }

        .welcome-hero {
            text-align: right;
            padding: 2.8rem 2.2rem;
            background: linear-gradient(
                            135deg,
                            var(--bg-body-from),
                            var(--bg-body-to)
                        );
            border-radius: 18px;
            color: #fff;
            margin-bottom: 1.8rem;
            box-shadow: 0 16px 32px rgba(15, 118, 110, 0.2);
            border: 2px solid var(--primary-gold);
            position: relative;
            overflow: hidden;
        }
        .welcome-hero::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            left: -45px;
            bottom: -80px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            box-shadow: 0 0 0 18px rgba(255, 255, 255, 0.05),
                        0 0 0 36px rgba(255, 255, 255, 0.04);
        }
        .welcome-hero h2 {
            font-family: var(--title-font);
            font-size: 1.55rem;
            margin-bottom: 0.6rem;
            position: relative;
            z-index: 1;
        }
        .welcome-hero p {
            font-size: 0.95rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            margin: 1.8rem 0 0.9rem;
            padding: 0.65rem 0.85rem;
            background: rgba(19, 78, 74, 0.76);
            border: 1px solid var(--border-color);
            border-right: 4px solid var(--primary-gold);
            border-radius: var(--card-radius);
        }
        .section-title::before {
            content: '\f0c0';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: var(--primary-gold);
        }

        /* ==========================================
           10) بطاقات الاختيار الرئيسية
           ========================================== */
        .home-choice-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            max-width: 100%;
            margin: 0;
        }
        .home-choice-card {
            background: rgba(13, 148, 136, 0.9);
            border: 1px solid var(--border-color);
            border-top: var(--border-top-width) solid var(--primary-gold);
            border-radius: var(--card-radius);
            padding: 1.4rem;
            min-height: 150px;
            text-align: right;
            color: var(--text-white);
            cursor: pointer;
            transition: var(--transition-speed);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }
        .home-choice-card:hover {
            transform: translateY(var(--hover-lift));
            box-shadow: var(--card-hover-shadow);
        }
        .home-choice-card .choice-icon {
            width: 62px;
            height: 62px;
            margin: 0 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary-gold);
            border-radius: 22px;
            background: rgba(196, 127, 50, 0.12);
            color: var(--primary-gold);
            font-size: 2rem;
            box-shadow: 0 0 18px rgba(196, 127, 50, 0.22),
                        inset 0 0 14px rgba(196, 127, 50, 0.08);
        }
        .home-choice-card:first-child .choice-icon {
            color: #d99a52;
            transform: rotate(-3deg);
        }
        .home-choice-card:last-child .choice-icon {
            color: #e2a45b;
            border-radius: 50%;
        }
        .home-choice-card h2 {
            color: #ffffff;
            font-family: var(--title-font);
            font-size: 1.05rem;
            margin-bottom: 5px;
        }
        .home-choice-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ==========================================
           11) أنماط البطاقات المتعددة
           ========================================== */
        body.card-modern .home-choice-card {
            border-radius: 12px;
            border-top: 4px solid var(--primary-gold);
            background: linear-gradient(145deg, var(--bg-card), rgba(0, 0, 0, 0.15));
        }

        body.card-classic .home-choice-card {
            border-radius: 4px;
            border: 2px solid var(--primary-gold);
            background: var(--bg-card);
            box-shadow: 6px 6px 0 var(--primary-gold);
        }

        body.card-flat .home-choice-card {
            border-radius: 0;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            box-shadow: none;
        }

        body.card-glass .home-choice-card {
            border-radius: 18px;
            background: rgba(13, 148, 136, 0.35);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        body.card-neon .home-choice-card {
            border-radius: 14px;
            background: var(--bg-card);
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 20px var(--primary-gold-glow),
                        inset 0 0 12px var(--primary-gold-glow);
        }

        body.card-gradient .home-choice-card {
            border-radius: 16px;
            background: linear-gradient(135deg, var(--bg-card), var(--primary-gold));
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        body.card-outline .home-choice-card {
            border-radius: 12px;
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
        }
        body.card-outline .home-choice-card h2,
        body.card-outline .home-choice-card p {
            color: var(--primary-gold);
        }

        /* ==========================================
           12) شبكة الحلقات
           ========================================== */
        .circles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .circle-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary-gold);
            border-radius: 12px;
            padding: 20px 14px;
            text-align: center;
            color: var(--text-white);
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: block;
        }
        .circle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            border-color: var(--primary-gold);
        }
        .circle-card .circle-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(196, 127, 50, 0.12);
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            font-size: 1.6rem;
        }
        .circle-card h3 {
            font-family: var(--title-font);
            font-size: 1rem;
            margin-bottom: 6px;
            color: #fff;
        }
        .circle-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .home-section-heading {
            color: var(--primary-gold);
            text-align: center;
            margin-bottom: 20px;
        }
        .back-home-btn {
            display: block;
            margin: 0 auto 25px;
        }

        /* ==========================================
           13) لوحة الخاتمين
           ========================================== */
        .khatmeen-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .khatmeen-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 18px rgba(31, 49, 55, 0.08);
        }
        .khatmeen-form-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            align-items: end;
        }
        .khatmeen-table-wrap {
            overflow-x: auto;
        }
        .khatmeen-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }
        .khatmeen-table th,
        .khatmeen-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            text-align: right;
        }
        .khatmeen-table th {
            color: var(--bg-dark);
            background: var(--primary-gold);
        }
        .khatmeen-table td {
            color: var(--text-muted);
        }
        .khatmeen-separator td {
            padding: 8px 0;
            border-bottom: 0;
        }
        .khatmeen-separator-line {
            border-top: 3px solid var(--primary-gold);
            position: relative;
            text-align: center;
            margin: 10px 0;
        }
        .khatmeen-separator-label {
            display: inline-block;
            position: relative;
            top: -16px;
            padding: 3px 18px;
            border: 2px solid var(--primary-gold);
            border-radius: 20px;
            background: var(--bg-dark);
            color: #fff;
            font-weight: 700;
        }
        .khatmeen-separator-delete {
            margin-right: 8px;
            padding: 2px 7px;
            border: 1px solid var(--danger-color);
            border-radius: 6px;
            background: transparent;
            color: var(--danger-color);
            cursor: pointer;
            font-family: 'Cairo';
            font-size: 0.75rem;
        }
        .khatmeen-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-start;
        }
        .khatmeen-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 25px;
        }

        /* ==========================================
           14) الأخبار
           ========================================== */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .news-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--primary-gold);
            border-radius: var(--card-radius);
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 18px rgba(31, 49, 55, 0.08);
        }
        .news-item img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            max-height: 300px;
            object-fit: cover;
        }
        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--primary-gold);
        }
        .news-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .news-body {
            color: var(--text-muted);
            font-size: 1rem;
            white-space: pre-wrap;
        }

        /* ==========================================
           15) أزرار عامة
           ========================================== */
        .admin-controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-sm {
            padding: 6px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Cairo';
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-edit {
            background: #3b82f6;
            color: white;
        }
        .btn-delete {
            background: var(--danger-color);
            color: white;
        }
        .btn-action {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: var(--primary-gold);
            color: var(--bg-dark);
            font-weight: 800;
            font-family: var(--title-font);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-action:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--primary-gold-glow);
        }
        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ==========================================
           16) المعلمون
           ========================================== */
        .teachers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            width: 100%;
            align-items: start;
        }
        .teacher-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--primary-gold);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            position: relative;
            transition: 0.3s;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }
        .teacher-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-gold);
        }
        .teacher-icon-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--primary-gold);
        }
        .teacher-icon-box svg {
            width: 45px;
            height: 45px;
            fill: var(--primary-gold);
        }
        .t-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 5px;
            text-align: center;
            display: block;
        }
        .t-halaqa {
            font-size: 0.9rem;
            color: var(--primary-gold);
            margin-bottom: 15px;
            font-weight: 600;
            display: inline-block;
            background: rgba(196, 127, 50, 0.1);
            padding: 4px 12px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .t-desc {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
